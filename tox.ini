[tox]
isolated_build = true
envlist = py{310,311}-dj{32,42,50,51,52,latest}-{mysql,postgresql,sqlite},py{310,311}-dj{50,51,52,latest}-oracle,lint,mypy,py{312,313}-dj{50,51,52,60,latest},py{312,313}-dj{50,51,52,60,latest}-oracle,py314-dj{60,latest},py314-dj{60,latest}-oracle

[testenv]
allowlist_externals = poetry
setenv =
    mysql: DATABASES_MODULE=mysql
    oracle: DATABASES_MODULE=oracle
    postgresql: DATABASES_MODULE=postgresql
    sqlite: DATABASES_MODULE=sqlite
commands =
    poetry install --no-root --with dev
    dj32: poetry run pip install "Django>=3.2,<4.0"
    dj42: poetry run pip install "Django>=4.2,<5.0"
    dj50: poetry run pip install "Django>=5.0,<5.1"
    dj51: poetry run pip install "Django>=5.1,<5.2"
    dj52: poetry run pip install "Django>=5.2,<5.3"
    dj60: poetry run pip install "Django>=6.0,<6.1"
    djlatest: poetry run pip install -U Django
    oracle: poetry run pip install oracledb
    poetry run pytest --cov-report xml:coverage{envname}.xml

[testenv:lint]
description = lint source code
deps =
    ruff
commands =
    ruff --check .
    ruff format --check .


[testenv:mypy]
description = lint source code
deps =
    mypy
    django-stubs
    pytest
    pytest-django
commands =
    mypy .


[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
